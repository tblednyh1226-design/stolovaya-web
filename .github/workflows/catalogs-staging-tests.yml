name: Catalogs staging tests
on:
  push:
    branches: [stolovaya-staging-20261031]
    paths:
      - "admin/catalogs/**"
      - "admin/closing-audit/**"
      - "admin/warehouse-transfers/**"
      - "admin/document-register/**"
      - "admin/admin.js"
      - "tests/catalogs.test.mjs"
      - "tests/closing-audit.test.mjs"
      - "tests/warehouse-transfers.test.mjs"
      - "tests/document-register.test.mjs"
      - ".github/workflows/catalogs-staging-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check admin/catalogs/catalogs.js
      - run: node --check admin/catalogs/domain.mjs
      - run: node --test tests/catalogs.test.mjs
      - run: node --check admin/closing-audit/audit.js
      - run: node --test tests/closing-audit.test.mjs
      - run: node --check admin/warehouse-transfers/transfers.js
      - run: node --test tests/warehouse-transfers.test.mjs
      - run: node --check admin/document-register/register.js
      - run: node --test tests/document-register.test.mjs
