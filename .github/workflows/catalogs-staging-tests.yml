name: Catalogs staging tests
on:
  push:
    branches: [stolovaya-staging-20261031]
    paths:
      - "admin/catalogs/**"
      - "tests/catalogs.test.mjs"
      - ".github/workflows/catalogs-staging-tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check admin/catalogs/catalogs.js
      - run: node --check admin/catalogs/domain.mjs
      - run: node --test tests/catalogs.test.mjs
