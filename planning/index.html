<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планирование</title><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f4f5f7;color:#202532}header{padding:16px 20px;background:#fff;position:sticky;top:0;z-index:20;border-bottom:1px solid #ddd}h1{font-size:22px;margin:0}.sub{color:#68707d;margin-top:4px}.home{padding:24px}.menu{background:#fff;border-radius:14px;padding:20px;max-width:520px}.big{width:100%;padding:18px;border:0;border-radius:12px;background:#202532;color:#fff;font-size:18px;font-weight:700}.hide{display:none}.wrap{padding:12px}.back{border:0;background:#e9edf3;border-radius:8px;padding:10px 12px;margin-bottom:10px}.box{background:#fff;border-radius:10px;margin-bottom:18px;overflow:auto;max-height:72vh;border:1px solid #e0e3e8}.pt{position:sticky;left:0;top:0;z-index:12;background:#fff;font-weight:700;font-size:18px;padding:12px;min-width:180px;border-bottom:1px solid #ddd}table{border-collapse:separate;border-spacing:0;font-size:12px;min-width:max-content}th,td{border-right:1px solid #cfd4dc;border-bottom:1px solid #cfd4dc;padding:5px 6px;text-align:right;min-width:58px;height:30px}thead th{position:sticky;top:46px;z-index:8;background:#eef1f5}.cat{position:sticky!important;left:0!important;z-index:10!important;background:#fff!important;text-align:left!important;min-width:155px!important;max-width:155px}.date{background:#eef1f5!important;text-align:center}.pink{background:#f9dbe7!important;font-weight:700}.red{color:#d01818;font-weight:700}.muted{color:#89919d}.planhead{background:#fff1f1!important}.legend{font-size:12px;color:#68707d;margin:0 0 10px 2px}
</style></head><body><header><h1>ПЛАНИРОВАНИЕ</h1><div class="sub">Рабочие отчёты</div></header><div id="home" class="home"><div class="menu"><button class="big" onclick="openReport()">Иркин отчёт</button></div></div><div id="report" class="wrap hide"><button class="back" onclick="back()">← Планирование</button><div class="legend">Факт по дням → розовая средняя после среды → плановый остаток на следующий рабочий день.</div><div id="a">Загрузка…</div></div><script>
const API="https://rgluzdxikpagugpmusbp.supabase.co/functions/v1/stolovaya-planning";
function openReport(){home.classList.add("hide");report.classList.remove("hide");run()}
function back(){report.classList.add("hide");home.classList.remove("hide")}
function n(v){return v===undefined||v===null?"—":v}
function monday(d){let x=new Date(d+"T12:00:00"),w=(x.getDay()+6)%7;x.setDate(x.getDate()-w);return x.toISOString().slice(0,10)}
function pinkAvg(row,dates,point,target){let m=monday(target),md=new Date(m+"T12:00:00");let pick=[];for(let off of [0,1,2]){let x=new Date(md);x.setDate(x.getDate()+off);pick.push(x.toISOString().slice(0,10))}let prev=new Date(md);prev.setDate(prev.getDate()-7);pick.push(new Date(prev.getTime()+3*86400000).toISOString().slice(0,10));if(point!=="ЭТМ")pick.push(new Date(prev.getTime()+4*86400000).toISOString().slice(0,10));let vals=pick.map(d=>row.days[d]?.s).filter(v=>typeof v==="number");return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):"—"}
async function run(){try{a.textContent="Загрузка…";let j=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:"{}"}).then(x=>x.json());if(!j.ok)throw Error(j.error);let last=j.dates[j.dates.length-1],week=monday(last),show=j.dates.filter(d=>d>=week);if(show.length<5)show=j.dates.slice(-7);let s="";
for(let p of j.points){s+='<div class="box"><div class="pt">'+p.name+'</div><table><thead><tr><th class="cat" rowspan="2">Группа</th>';for(let d of show)s+='<th class="date" colspan="4">'+d.slice(8,10)+'.'+d.slice(5,7)+'</th>';s+='<th class="pink" rowspan="2">Средняя</th><th class="planhead" rowspan="2">План</th></tr><tr>';for(let d of show)s+='<th>приход</th><th>остаток</th><th>доступно</th><th>продано</th>';s+='</tr></thead><tbody>';
for(let r of p.rows){let avg=pinkAvg(r,j.dates,p.name,last),plan=r.days[last]?.plan;s+='<tr><td class="cat">'+r.category+'</td>';for(let d of show){let x=r.days[d];s+=x?'<td>'+n(x.i)+'</td><td>'+n(x.c)+'</td><td>'+n(x.a)+'</td><td>'+n(x.s)+'</td>':'<td colspan="4" class="muted">—</td>'}s+='<td class="pink">'+avg+'</td><td class="red">'+n(plan)+'</td></tr>'}s+='</tbody></table></div>'}a.innerHTML=s;requestAnimationFrame(()=>document.querySelectorAll(".box").forEach(b=>b.scrollLeft=b.scrollWidth))}catch(e){a.textContent="Ошибка загрузки: "+e.message}}
</script></body></html>
