<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планирование — Иркин отчёт</title><style>body{font-family:Arial;margin:0;background:#f4f5f7;color:#202532}header{padding:16px 20px;background:#fff;position:sticky;top:0;z-index:5;border-bottom:1px solid #ddd}h1{font-size:22px;margin:0}.sub{color:#68707d;margin-top:4px}.wrap{padding:12px}.box{background:#fff;border-radius:10px;margin-bottom:18px;padding:10px;overflow:auto}.pt{font-weight:700;font-size:18px;padding:5px 2px 10px}table{border-collapse:collapse;font-size:12px}th,td{border:1px solid #cfd4dc;padding:5px 6px;text-align:right;min-width:55px}th.cat,td.cat{position:sticky;left:0;background:#fff;z-index:2;text-align:left;min-width:145px}.date{background:#eef1f5;text-align:center}.pink{background:#f9dbe7}.red{color:#d01818;font-weight:700}.muted{color:#89919d}.home{padding:24px}.menu{background:#fff;border-radius:14px;padding:20px;max-width:520px}.big{display:block;width:100%;padding:18px;border:0;border-radius:12px;background:#202532;color:#fff;font-size:18px;font-weight:700}.back{border:0;background:#eef1f5;border-radius:8px;padding:9px 12px;margin-bottom:10px}.hide{display:none}</style></head><body><header><h1>ПЛАНИРОВАНИЕ</h1><div class="sub">Иркин отчёт · история из приложения</div></header><div id="home" class="home"><div class="menu"><button class="big" onclick="openReport()">Иркин отчёт</button></div></div><div class="wrap hide" id="report"><button class="back" onclick="back()">← Планирование</button><div id="a">Загрузка…</div></div><script>const API="https://rgluzdxikpagugpmusbp.supabase.co/functions/v1/stolovaya-planning";function openReport(){home.classList.add("hide");report.classList.remove("hide");run()}function back(){report.classList.add("hide");home.classList.remove("hide")}async function run(){try{let j=await fetch(API,{method:"POST",headers:{"content-type":"application/json"},body:"{}"}).then(x=>x.json());if(!j.ok)throw Error(j.error);let s="";for(let p of j.points){s+="<div class=box><div class=pt>"+p.name+"</div><table><tr><th class=cat rowspan=2>Группа</th>";for(let d of j.dates)s+="<th class=date colspan=6>"+d.slice(8,10)+"."+d.slice(5,7)+"</th>";s+="</tr><tr>";for(let d of j.dates)s+="<th>приход</th><th>остаток</th><th>доступно</th><th>продано</th><th class=pink>средняя</th><th>план</th>";s+="</tr>";for(let r of p.rows){s+="<tr><td class=cat>"+r.category+"</td>";for(let d of j.dates){let x=r.days[d];if(!x)s+="<td colspan=6 class=muted>—</td>";else s+="<td>"+x.i+"</td><td>"+x.c+"</td><td>"+x.a+"</td><td>"+x.s+"</td><td class=pink>"+r.hist[d]+"</td><td class=red>"+(x.plan??"—")+"</td>"}s+="</tr>"}s+="</table></div>"}a.innerHTML=s;requestAnimationFrame(()=>document.querySelectorAll(".box").forEach(b=>b.scrollLeft=b.scrollWidth))}catch(e){a.textContent="Ошибка загрузки: "+e.message}}</script></body></html>
