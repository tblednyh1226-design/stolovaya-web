<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Планирование</title><style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f3f3f3;color:#111}header{padding:14px 18px;background:#fff;border-bottom:1px solid #bbb;position:sticky;top:0;z-index:30}h1{font-size:21px;margin:0}.sub{font-size:13px;color:#666;margin-top:3px}.home{padding:22px}.menu{background:#fff;padding:18px;max-width:500px;border:1px solid #ccc}.big{width:100%;padding:17px;background:#222;color:#fff;border:0;font-size:18px;font-weight:700}.hide{display:none}.wrap{padding:10px}.back{padding:8px 12px;margin-bottom:8px}.sheet{background:#fff;border:1px solid #999;margin-bottom:22px;overflow:auto;max-height:78vh}.point{position:sticky;left:0;top:0;z-index:25;background:#fff;font-size:18px;font-weight:700;padding:8px 10px;border-bottom:2px solid #333;width:max-content;min-width:210px}.grid{border-collapse:separate;border-spacing:0;font-size:11px;min-width:max-content}.grid th,.grid td{border-right:1px solid #777;border-bottom:1px solid #999;height:25px;padding:3px 5px;text-align:right;min-width:48px;background:#fff}.grid thead th{position:sticky;top:39px;z-index:18}.group{position:sticky!important;left:0!important;z-index:20!important;min-width:150px!important;max-width:150px!important;text-align:left!important;font-weight:700;background:#fff!important}.kind{position:sticky!important;left:150px!important;z-index:20!important;min-width:72px!important;text-align:left!important;background:#fff!important}.week{background:#d9e2f3!important;text-align:center!important;font-weight:700;border-left:3px solid #333!important}.day{background:#e9eff8!important;text-align:center!important;font-weight:700}.weekStart{border-left:3px solid #333!important}.avg{background:#f4cccc!important;font-weight:700}.future{color:#c00000;font-weight:700}.total td{font-weight:700;border-bottom:2px solid #333}.catStart td{border-top:2px solid #333}.blank{color:#aaa}.note{font-size:12px;color:#666;margin:0 0 8px}
</style></head><body><header><h1>ПЛАНИРОВАНИЕ</h1><div class="sub">Рабочие отчёты</div></header><div id="home" class="home"><div class="menu"><button class="big" onclick="openReport()">Иркин отчёт</button></div></div><div id="report" class="wrap hide"><button class="back" onclick="back()">← Планирование</button><div class="note">История прокручивается влево. При открытии показаны последние даты.</div><div id="a">Загрузка…</div></div><script>
const API="https://rgluzdxikpagugpmusbp.supabase.co/functions/v1/stolovaya-planning",DN=["ВС","ПН","ВТ","СР","ЧТ","ПТ","СБ"];
function openReport(){document.getElementById("home").classList.add("hide");document.getElementById("report").classList.remove("hide");run()} function back(){document.getElementById("report").classList.add("hide");document.getElementById("home").classList.remove("hide")}
function v(x){return x===undefined||x===null||x==="—"?"":x}
function mon(d){let x=new Date(d+"T12:00:00"),q=(x.getDay()+6)%7;x.setDate(x.getDate()-q);return x.toISOString().slice(0,10)}
function weekLabel(d){let m=mon(d),x=new Date(m+"T12:00:00"),y=new Date(x);y.setDate(y.getDate()+6);return m.slice(8,10)+"."+m.slice(5,7)+"–"+y.toISOString().slice(8,10)+"."+y.toISOString().slice(5,7)}
function avgForWeek(row,w){let pick=w==="2026-09-14"?["2026-09-10","2026-09-11","2026-09-14","2026-09-15","2026-09-16"]:w==="2026-09-21"?["2026-09-17","2026-09-18","2026-09-21","2026-09-22","2026-09-23"]:[];let z=pick.map(d=>row.days[d]?.s).filter(x=>typeof x==="number");return z.length?Math.round((z.reduce((a,b)=>a+b,0)/z.length)*100)/100:""}
async function run(){let box=document.getElementById("a");try{box.textContent="Загрузка…";let r=await fetch(API,{method:"POST",headers:{"content-type":"text/plain"},body:"{}",cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);let j=await r.json();if(!j.ok)throw Error(j.error);let dates=j.dates,s="";
for(let p of j.points){s+='<div class="sheet"><div class="point">'+p.name+'</div><table class="grid"><thead><tr><th class="group" rowspan="3">Группа</th><th class="kind" rowspan="3">Показатель</th>';let i=0;while(i<dates.length){let w=mon(dates[i]),n=0;while(i+n<dates.length&&mon(dates[i+n])===w)n++;s+='<th class="week" colspan="'+(n*2+1)+'">'+weekLabel(dates[i])+'</th>';i+=n}s+='<th rowspan="3">ПЛАН</th></tr><tr>';dates.forEach((d,di)=>{let ws=new Date(d+"T12:00:00").getDay()===1;s+='<th class="day '+(ws?"weekStart":"")+'" colspan="2">'+DN[new Date(d+"T12:00:00").getDay()]+' '+d.slice(8,10)+'.'+d.slice(5,7)+'</th>';let next=dates[di+1];if(!next||mon(next)!==mon(d))s+='<th class="avg" rowspan="2">СРЕДНЯЯ</th>'});s+='</tr><tr>';dates.forEach((d,di)=>{let ws=new Date(d+"T12:00:00").getDay()===1;s+='<th class="'+(ws?"weekStart":"")+'">наличие</th><th></th>';let next=dates[di+1]});s+='</tr></thead><tbody>';
for(let r of p.rows){let last=dates[dates.length-1],plan=r.days[last]?.plan;let rows=[["план. приход","i"],["остаток","c"],["ВСЕГО","a"]];rows.forEach((rr,ri)=>{s+='<tr class="'+(ri===0?"catStart ":"")+(ri===2?"total":"")+'"><td class="group">'+(ri===0?r.category:"")+'</td><td class="kind">'+rr[0]+'</td>';dates.forEach((d,di)=>{let x=r.days[d],ws=new Date(d+"T12:00:00").getDay()===1;if(ri===0)s+='<td class="'+(ws?"weekStart ":"")+'">'+v(x?.i)+'</td><td></td>';else if(ri===1)s+='<td class="'+(ws?"weekStart ":"")+'">'+v(x?.c)+'</td><td></td>';else s+='<td class="'+(ws?"weekStart ":"")+'">'+v(x?.a)+'</td><td style="font-weight:700">'+v(x?.s)+'</td>';let next=dates[di+1];if(!next||mon(next)!==mon(d))s+='<td class="avg">'+(ri===2?avgForWeek(r,mon(d)):"")+'</td>'});s+='<td class="future">'+(ri===1?v(plan):"")+'</td></tr>'})}s+='</tbody></table></div>'}box.innerHTML=s;setTimeout(()=>document.querySelectorAll(".sheet").forEach(x=>x.scrollLeft=x.scrollWidth),0)}catch(e){box.textContent="Ошибка загрузки: "+(e&&e.message?e.message:String(e))}}
</script></body></html>
