<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>Столовая — Telegram</title><link rel="stylesheet" href="../admin.css?v=20260914-tg2"></head><body><main class="admin"><header class="top"><div><a class="section-back" href="../">← Назад в админку</a><small>СТОЛОВАЯ • АДМИНИСТРАТОР</small><h1>Telegram</h1><p class="subtitle">Подключение бота уведомлений</p></div></header><section class="card"><h2>Подключить бота</h2><p>Вставьте новый токен BotFather. После сохранения он больше не отображается на экране.</p><input id="bot-token" type="password" autocomplete="off" placeholder="Токен BotFather" style="width:100%;box-sizing:border-box;margin:12px 0"><button id="connect">Проверить и подключить</button><p id="message" class="message"></p></section></main><script src="../../yandex-bridge-20260908.js?v=20260914-tg2"></script><script src="../admin-session-persist-20260911.js?v=20260914-tg2"></script><script>const API='https://rgluzdxikpagugpmusbp.supabase.co/rest/v1/rpc',KEY='sb_publishable_rcvNssgN4_dPnVUpjU0bjQ_1cEWsA52',BOT_FN='https://rgluzdxikpagugpmusbp.supabase.co/functions/v1/stolovaya-telegram-bot';const msg=document.getElementById('message');document.getElementById('connect').onclick=async()=>{const input=document.getElementById('bot-token'),token=input.value.trim(),admin=sessionStorage.getItem('stolovaya:admin')||localStorage.getItem('stolovaya:admin')||'';if(!admin){msg.textContent='Сначала войдите в админку';return}if(!token){msg.textContent='Вставьте токен';return}msg.textContent='Проверяем токен и подключаем…';try{const r=await fetch(API+'/admin_configure_telegram_bot',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:admin,p_bot_token:token})});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||'Не удалось сохранить токен');const s=await fetch(BOT_FN+'?setup=1',{method:'POST'});const sd=await s.json().catch(()=>null);if(!s.ok||!sd?.ok)throw new Error(sd?.error||'Токен сохранён, но Telegram не удалось проверить');input.value='';msg.textContent='Бот подключён и готов: @'+(sd.username||d.botUsername||'stolovaya_control_bot')}catch(e){msg.textContent=e.message||'Не удалось подключить'}};</script></body></html>
