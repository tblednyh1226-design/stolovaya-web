<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Выгрузка перемещений в iiko</title><style>body{font:16px system-ui;background:#f5f5f0;color:#25392e;margin:0}main{max-width:850px;margin:20px auto;padding:16px}article{background:white;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}button{background:#245b42;color:white;border:0;border-radius:8px;padding:10px 15px;font-weight:600}button:disabled{opacity:.5}small{color:#657267}a{color:#245b42}.error{color:#9a332e}</style></head><body><main><a href="../">← Администратор</a><h1>Выгрузка внутренних перемещений в iiko</h1><p>Отправка только по нажатию администратора. Перед повторной отправкой проверяется номер документа в iiko.</p><button id="refresh">Обновить список</button><p id="message"></p><div id="list">Загрузка…</div></main><script>
const API='https://rgluzdxikpagugpmusbp.supabase.co/rest/v1/rpc',KEY='sb_publishable_rcvNssgN4_dPnVUpjU0bjQ_1cEWsA52';
const token=sessionStorage.getItem('stolovaya:admin')||localStorage.getItem('stolovaya:admin');
const list=document.getElementById('list'),message=document.getElementById('message');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));
async function rpc(name,args){const r=await fetch(API+'/'+name,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(args)});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||'HTTP '+r.status);return d}
async function load(){if(!token){location.href='../';return}list.textContent='Загружаем…';try{const rows=await rpc('admin_internal_transfer_export_list',{p_token:token});list.innerHTML=rows.length?rows.map(x=>'<article><b>'+esc(x.date)+' · '+esc(x.from)+' → '+esc(x.to)+'</b><p>Статус: '+esc(x.status)+(x.error?' · <span class="error">'+esc(x.error)+'</span>':'')+'</p>'+(x.status==='ready_to_export'||x.status==='export_error'?'<button data-id="'+esc(x.id)+'">Выгрузить в iiko</button>':'<small>Отправка недоступна при этом статусе</small>')+'</article>').join(''):'Нет ожидающих перемещений';list.querySelectorAll('button[data-id]').forEach(b=>b.onclick=async()=>{if(!confirm('Отправить выбранное перемещение в iiko?'))return;b.disabled=true;message.textContent='Отправляем…';try{const result=await rpc('admin_internal_transfer_export_action',{p_token:token,p_transfer_id:b.dataset.id});message.textContent=result.status==='exported'?'Уже выгружено':'Отправка запущена. Обновите список через несколько секунд.';setTimeout(load,4000)}catch(e){message.textContent=e.message;b.disabled=false}})}catch(e){list.textContent='Ошибка: '+e.message}}
document.getElementById('refresh').onclick=load;load();
</script></body></html>
