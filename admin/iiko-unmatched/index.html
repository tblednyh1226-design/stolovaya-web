<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0"><title>Столовая — несопоставленные iiko</title><link rel="stylesheet" href="../admin.css?v=20260914-iiko-unmatched"><style>.summary{display:flex;gap:12px;flex-wrap:wrap}.summary .card{min-width:130px}.table-wrap{overflow:auto}.u-table{width:100%;border-collapse:collapse;font-size:14px}.u-table th,.u-table td{padding:10px;border-bottom:1px solid #e6e0d4;text-align:left;vertical-align:top;white-space:nowrap}.u-table td.name{white-space:normal;min-width:220px}.empty{padding:20px 0;color:#68736d}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.toolbar select{padding:10px 12px;border:1px solid #d7d2c6;border-radius:10px;background:#fff}</style></head><body><main class="admin"><header class="top"><div><a class="section-back" href="../">← Назад в админку</a><small>СТОЛОВАЯ • iiko</small><h1>Несопоставленные строки</h1><p class="subtitle">Позиции из iiko, которым не найдено блюдо в справочнике</p></div></header><section class="card"><div class="toolbar"><label>Период <select id="days"><option value="2">2 дня</option><option value="7">7 дней</option><option value="14" selected>14 дней</option><option value="30">30 дней</option><option value="90">90 дней</option></select></label><button id="refresh">Обновить</button></div><p id="status" class="message"></p></section><section class="card"><div class="summary"><div><small>Реально несопоставлено</small><h2 id="count">—</h2></div></div><div class="table-wrap"><table class="u-table"><thead><tr><th>Дата</th><th>Документ</th><th>Откуда</th><th>Куда</th><th>Код</th><th>Наименование</th><th>Кол-во</th></tr></thead><tbody id="rows"></tbody></table><div id="empty" class="empty" hidden>Несопоставленных строк за выбранный период нет.</div></div></section></main><script>const API='https://rgluzdxikpagugpmusbp.supabase.co/rest/v1/rpc',KEY='sb_publishable_rcvNssgN4_dPnVUpjU0bjQ_1cEWsA52';const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const token=sessionStorage.getItem('stolovaya:admin')||localStorage.getItem('stolovaya:admin')||'';const status=document.getElementById('status');if(!token){status.textContent='Сначала войдите в админку.';return}status.textContent='Загрузка…';const r=await fetch(API+'/admin_iiko_unmatched_lines',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token,p_days:Number(document.getElementById('days').value),p_limit:300})});const d=await r.json().catch(()=>null);if(!r.ok){status.textContent=d?.message||'Не удалось загрузить';return}document.getElementById('count').textContent=d.count??0;const rows=d.rows||[];document.getElementById('rows').innerHTML=rows.map(x=>`<tr><td>${esc(x.businessDate)}</td><td>${esc(x.documentNumber||'—')}</td><td>${esc(x.fromStore||'—')}</td><td>${esc(x.toStore||'—')}</td><td>${esc(x.productCode||'—')}</td><td class="name">${esc(x.productName||'—')}</td><td>${esc(x.quantity)}</td></tr>`).join('');document.getElementById('empty').hidden=rows.length>0;status.textContent=`Показаны данные за ${d.days} дн.`}document.getElementById('refresh').onclick=load;document.getElementById('days').onchange=load;load();</script></body></html>
