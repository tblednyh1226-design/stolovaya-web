<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#f6f3ea">
  <title>Столовая</title>
  <link rel="stylesheet" href="style.css?v=20260908-1002">
  <link rel="stylesheet" href="testing-date.css?v=20260908-1002">
  <style>.help-entry{position:fixed;left:14px;bottom:14px;z-index:9998;text-decoration:none;background:#fff;color:#315f49;border:1px solid #cfc9bb;border-radius:999px;padding:12px 16px;font-weight:700;box-shadow:0 8px 24px #0002}.admin-entry{z-index:9998}</style>
</head>
<body>
  <main id="app" class="app"><section class="loading-card">Загрузка…</section></main>
  <a class="help-entry" href="instruction.html?v=20260908-1002">? Как работать</a>
  <a class="admin-entry" href="admin/">Администратор</a>
  <script>
  window.addEventListener('error', function(event) {
    var msg = event.message || 'JavaScript error';
    var file = event.filename || 'unknown';
    var line = event.lineno || 0;
    var column = event.colno || 0;
    var target = document.getElementById('app');
    if (target && (/Invalid regular expression flags/i.test(msg) || /SyntaxError/i.test(msg))) {
      target.innerHTML = '<section class="loading-card" style="padding:20px;overflow-wrap:anywhere"><h2>Ошибка загрузки приложения</h2><p>' +
        String(msg).replace(/&/g,'&amp;').replace(/</g,'&lt;') +
        '</p><p style="font-size:13px">Файл: ' + String(file).replace(/&/g,'&amp;').replace(/</g,'&lt;') +
        '<br>Строка: ' + line + ', столбец: ' + column + '</p></section>';
    }
  }, true);
  </script>
  <script src="app.js?v=20261031-transfer-after-close"></script>
  <script src="testing-date.js?v=20260908-1002"></script>
</body>
</html>
